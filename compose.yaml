services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: noema
      POSTGRES_PASSWORD: noema
      POSTGRES_DB: noema
      PGDATA: /noema/db/postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${NOEMA_HOME:-${HOME}/.noema}:/noema
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noema -d noema"]
      interval: 2s
      timeout: 3s
      retries: 20

  noema-server:
    profiles:
      - server
      - web
    build:
      context: .
      target: dev
    working_dir: /workspace
    command: ["cargo", "run", "-p", "noema-cli", "--", "start"]
    environment:
      NOEMA_DATABASE_URL: postgres://noema:noema@postgres:5432/noema
      NOEMA_HOME: /noema
      NOEMA_OPENAI__API_KEY: ${NOEMA_OPENAI__API_KEY:-}
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/workspace/target
      - ${NOEMA_HOME:-${HOME}/.noema}:/noema
    ports:
      - "127.0.0.1:3737:3737"
    depends_on:
      postgres:
        condition: service_healthy

  dev:
    profiles:
      - dev
    build:
      context: .
      target: dev
    working_dir: /workspace
    command:
      - sh
      - -lc
      - cd crates/noema-core/web && bun install && cd /workspace && cargo dev-daemon
    environment:
      NOEMA_DATABASE_URL: postgres://noema:noema@postgres:5432/noema
      NOEMA_HOME: /noema
      NOEMA_OPENAI__API_KEY: ${NOEMA_OPENAI__API_KEY:-}
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/workspace/target
      - ${NOEMA_HOME:-${HOME}/.noema}:/noema
      - web-node-modules:/workspace/crates/noema-core/web/node_modules
    ports:
      - "127.0.0.1:3737:3737"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles:
      - web
    build:
      context: .
      target: dev
    working_dir: /workspace/crates/noema-core/web
    command: ["sh", "-lc", "bun install && bun run dev"]
    volumes:
      - .:/workspace
      - target:/workspace/target
      - bun-cache:/root/.bun/install/cache
      - web-node-modules:/workspace/crates/noema-core/web/node_modules
    depends_on:
      - noema-server

volumes:
  cargo-registry:
  cargo-git:
  target:
  bun-cache:
  web-node-modules:
