services:
  noema-server:
    profiles:
      - server
      - web
    build:
      context: .
      target: dev
    working_dir: /workspace
    command: ["cargo", "run", "-p", "noema-cli", "--", "start"]
    environment:
      NOEMA_HOME: /noema
      NOEMA_OPENAI__API_KEY: ${NOEMA_OPENAI__API_KEY:-}
      NOEMA_WEB__HOST: 0.0.0.0
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/workspace/target
      - ${NOEMA_HOME:-${HOME}/.noema}:/noema
      - noema-run:/noema/run
    ports:
      - "127.0.0.1:3737:3737"
  dev:
    profiles:
      - dev
    build:
      context: .
      target: dev
    working_dir: /workspace
    command:
      - sh
      - -c
      - cd crates/noema-core/web && bun install && cd /workspace && cargo dev-daemon
    environment:
      NOEMA_HOME: /noema
      NOEMA_OPENAI__API_KEY: ${NOEMA_OPENAI__API_KEY:-}
      NOEMA_WEB__HOST: 0.0.0.0
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/workspace/target
      - ${NOEMA_HOME:-${HOME}/.noema}:/noema
      - noema-run:/noema/run
      - web-node-modules:/workspace/crates/noema-core/web/node_modules
    ports:
      - "127.0.0.1:3737:3737"
  web:
    profiles:
      - web
    build:
      context: .
      target: dev
    working_dir: /workspace/crates/noema-core/web
    command: ["sh", "-c", "bun install && bun run dev"]
    volumes:
      - .:/workspace
      - target:/workspace/target
      - bun-cache:/root/.bun/install/cache
      - web-node-modules:/workspace/crates/noema-core/web/node_modules
    depends_on:
      - noema-server

volumes:
  cargo-registry:
  cargo-git:
  target:
  bun-cache:
  web-node-modules:
  noema-run:
