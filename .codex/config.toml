default_permissions = "noema-build"

[features.network_proxy]
# Direct networking permits Unix sockets, development relays, and socket tests.
enabled = false

[permissions.noema-build]
description = "Full local access for building, starting, and repairing the Noema development instance, including its privileged launcher."

[permissions.noema-build.filesystem]
# The Linux launcher needs root capabilities for bindfs, service ownership, and setpriv.
# A restricted filesystem profile drops those capabilities even with writable paths.
":root" = "write"

[permissions.noema-build.network]
enabled = true
