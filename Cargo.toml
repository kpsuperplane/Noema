[workspace]
members = [
    "crates/noema-core",
    "crates/noema-desktop",
    "crates/noema-home",
    "crates/noema-model-evals",
    "crates/noema-server",
]
default-members = ["crates/noema-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kpsuperplane/Noema"
rust-version = "1.96"

[workspace.dependencies]
async-graphql = "7"
async-graphql-axum = "7.2.1"
async-stream = "0.3"
axum = "0.8.9"
base64 = "0.22"
bytes = "1"
cap-std = "4.0.2"
chrono = "0.4.45"
figment = { version = "0.10", features = ["env", "yaml"] }
futures-util = "0.3"
fs2 = "0.4"
http = "1"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
readabilityrs = "0.1.3"
ring = "0.17"
rmcp = { version = "2.0.0", default-features = false, features = ["auth", "client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.37", features = ["bundled", "time"] }
scraper = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.11", features = ["limit", "set-header"] }
tower-sessions = { version = "0.15.0", default-features = false, features = ["axum-core", "memory-store", "private"] }
ts-rs = "12.0"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
must_use_candidate = "warn"
return_self_not_must_use = "warn"
ref_option = "warn"
unused_self = "warn"
