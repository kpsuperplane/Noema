[workspace]
members = [
    "crates/noema-artifacts",
    "crates/noema-capabilities",
    "crates/noema-capabilities/adapters",
    "crates/noema-capabilities/mcp",
    "crates/noema-conversations",
    "crates/noema-dev",
    "crates/noema-desktop",
    "crates/noema-home",
    "crates/noema-memory",
    "crates/noema-model-evals",
    "crates/noema-providers",
    "crates/noema-runtime",
    "crates/noema-store",
    "crates/noema-tasks",
    "crates/noema-workspaces",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kpsuperplane/Noema"
rust-version = "1.96"

[workspace.dependencies]
async-stream = "0.3"
agent-client-protocol = "2.0.0"
anydoc = "=0.1.9"
base64 = "0.22"
bytes = "1"
cap-std = "4.0.2"
cronexpr = "=1.6.0"
jiff = "=0.2.35"
jsonschema = { version = "0.49.8", default-features = false }
futures-util = "0.3"
fs2 = "0.4"
http = "1"
libc = "0.2"
mlua = { version = "0.12", default-features = false, features = ["luau", "vendored"] }
oauth2 = { version = "5", default-features = false }
obscura-browser = { git = "https://github.com/h4ckf0r0day/obscura.git", rev = "97124edeb2ea610615e78f43e097454e3b221f6b" }
obscura-js = { git = "https://github.com/h4ckf0r0day/obscura.git", rev = "97124edeb2ea610615e78f43e097454e3b221f6b" }
openapiv3 = "2.2"
process-wrap = { version = "9.1", default-features = false, features = ["creation-flags", "job-object", "kill-on-drop", "process-group", "tokio1"] }
psl = "2"
reqwest = { version = "0.13", default-features = false, features = ["form", "http2", "json", "rustls"] }
readabilityrs = "0.1.3"
ring = "0.17"
rmcp = { version = "2.0.0", default-features = false, features = ["auth", "client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.37", features = ["bundled", "time"] }
rusqlite_migration = "=2.3.0"
rustix = { version = "1", features = ["process"] }
scraper = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sse-stream = "0.2.3"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
ts-rs = "12.0"
url = "2.5"
unicode-segmentation = "1"

[patch.crates-io]
# Obscura's render feature uses these source-controlled renderer fixes.
cosmic-text = { git = "https://github.com/h4ckf0r0day/obscura.git", rev = "97124edeb2ea610615e78f43e097454e3b221f6b" }
taffy = { git = "https://github.com/h4ckf0r0day/obscura.git", rev = "97124edeb2ea610615e78f43e097454e3b221f6b" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
must_use_candidate = "warn"
return_self_not_must_use = "warn"
ref_option = "warn"
unused_self = "warn"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.dev-launcher]
inherits = "dev"
debug = 1
