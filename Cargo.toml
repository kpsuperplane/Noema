[workspace]
members = ["crates/noema-cli", "crates/noema-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kpsuperplane/Noema"
rust-version = "1.96"

[workspace.dependencies]
async-graphql = "7"
async-stream = "0.3"
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
figment = { version = "0.10", features = ["env", "yaml"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "macros"] }
surrealdb = { version = "2", default-features = false, features = ["kv-rocksdb"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
ts-rs = "12.0"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
must_use_candidate = "warn"
return_self_not_must_use = "warn"
ref_option = "warn"
unused_self = "warn"
