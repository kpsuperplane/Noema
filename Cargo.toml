[workspace]
members = ["crates/noema-desktop"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kpsuperplane/Noema"
rust-version = "1.96"

[workspace.dependencies]
base64 = "0.22"
futures-util = "0.3"
oauth2 = { version = "5", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["form", "http2", "json", "rustls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
must_use_candidate = "warn"
return_self_not_must_use = "warn"
ref_option = "warn"
unused_self = "warn"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 1
incremental = false
