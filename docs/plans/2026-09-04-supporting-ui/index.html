<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Noema supporting UI plan</title>
  <link rel="icon" href="assets/noema.png">
  <link rel="stylesheet" href="assets/typography.css">
  <link rel="stylesheet" href="assets/noema-theme.css">
  <link rel="stylesheet" href="mocks.css">
  <script src="mocks.js" defer></script>
</head>
<body>
  <header class="review-bar">
    <section class="review-title"><strong>Noema · Supporting flows</strong><a href="README.md">Implementation plan</a></section>
    <section class="review-controls" aria-label="Mock review controls">
      <label>Flow<select id="flow"></select></label>
      <label>State<select id="state"></select></label>
      <label>Width<select id="width"><option value="desktop">Desktop</option><option value="phone">Phone · 390 px</option><option value="narrow">Narrow · 320 px</option></select></label>
    </section>
    <p class="review-note">Design preview. Actions change examples only. Fields do not accept credentials.</p>
  </header>
  <main id="preview" data-width="desktop" aria-label="Proposed Noema screen">
    <section class="stage">
      <article class="sheet">
        <header class="brand"><img src="assets/noema.png" width="32" height="32" alt=""><span>Noema</span></header>
        <section id="screen" aria-labelledby="screen-title"></section>
      </article>
      <footer class="server-name">noema.kevinpei.com</footer>
    </section>
  </main>
  <aside class="review-context" aria-label="Implementation notes"><p id="intent"></p><p id="constraint"></p></aside>
  <p id="review-status" role="status"></p>
  <noscript>Enable JavaScript to select and review the example screens.</noscript>
</body>
</html>
