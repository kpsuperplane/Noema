<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base grid · --space-1 … --space-16" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); }
  .wrap { padding: 22px 26px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .bar { background: var(--pine-300); border-radius: 3px; width: 22px; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--text-primary); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="col"><span class="px">4</span><div class="bar" style="height:4px"></div><span class="tok">1</span></div>
      <div class="col"><span class="px">8</span><div class="bar" style="height:8px"></div><span class="tok">2</span></div>
      <div class="col"><span class="px">12</span><div class="bar" style="height:12px"></div><span class="tok">3</span></div>
      <div class="col"><span class="px">16</span><div class="bar" style="height:16px"></div><span class="tok">4</span></div>
      <div class="col"><span class="px">24</span><div class="bar" style="height:24px"></div><span class="tok">6</span></div>
      <div class="col"><span class="px">32</span><div class="bar" style="height:32px"></div><span class="tok">8</span></div>
      <div class="col"><span class="px">48</span><div class="bar" style="height:48px"></div><span class="tok">12</span></div>
      <div class="col"><span class="px">64</span><div class="bar" style="height:64px"></div><span class="tok">16</span></div>
    </div>
  </div>
</body>
</html>
