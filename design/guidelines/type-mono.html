<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); }
  .wrap { padding: 24px 26px; }
  .term { background: var(--ink-900); border-radius: var(--radius-md); padding: 14px 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.7; color: var(--paper-100); }
  .term .k { color: var(--pine-200); }
  .term .c { color: var(--clay-300); }
  .term .m { color: var(--ink-400); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="term"><span class="m">// 14:02:11</span>
<span class="k">noema</span> run <span class="c">research-agent</span> --local
<span class="m">→ called</span> web_search<span class="m">(query=</span>"rag papers"<span class="m">)</span> <span class="k">done</span></div>
    <div class="meta">JetBrains Mono · --font-mono · 400 / 500 / 600</div>
  </div>
</body>
</html>
