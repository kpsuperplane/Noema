<!-- @dsCard group="Colors" viewport="700x200" name="Paper → Ink — neutrals" subtitle="Warm greige surfaces and near-black ink text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); }
  .wrap { padding: 22px 24px; }
  .ramp { display: grid; grid-template-columns: repeat(11, 1fr); gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-xs); border: 1px solid var(--border-subtle); }
  .sw { height: 70px; display: flex; align-items: flex-end; padding: 6px 6px; }
  .sw span { font-family: var(--font-mono); font-size: 9px; }
  .meta { display: flex; justify-content: space-between; margin-top: 12px; }
  .meta b { font-size: var(--text-sm); color: var(--text-primary); }
  .meta code { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ramp">
      <div class="sw" style="background:var(--paper-50)"><span style="color:#5E5A4B">50</span></div>
      <div class="sw" style="background:var(--paper-100)"><span style="color:#5E5A4B">100</span></div>
      <div class="sw" style="background:var(--paper-200)"><span style="color:#5E5A4B">200</span></div>
      <div class="sw" style="background:var(--paper-300)"><span style="color:#5E5A4B">300</span></div>
      <div class="sw" style="background:var(--paper-400)"><span style="color:#2A2820">400</span></div>
      <div class="sw" style="background:var(--ink-400)"><span style="color:#17160F">i4</span></div>
      <div class="sw" style="background:var(--ink-500)"><span style="color:#FCFAF5">i5</span></div>
      <div class="sw" style="background:var(--ink-600)"><span style="color:#FCFAF5">i6</span></div>
      <div class="sw" style="background:var(--ink-700)"><span style="color:#FCFAF5">i7</span></div>
      <div class="sw" style="background:var(--ink-800)"><span style="color:#FCFAF5">i8</span></div>
      <div class="sw" style="background:var(--ink-900)"><span style="color:#FCFAF5">i9</span></div>
    </div>
    <div class="meta">
      <b>Paper&nbsp;→&nbsp;Ink</b>
      <code>page #FFFFFF · card #FFFFFF · text #17160F</code>
    </div>
  </div>
</body>
</html>
