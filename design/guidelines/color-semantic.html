<!-- @dsCard group="Colors" viewport="700x170" name="Semantic / status" subtitle="Success, warning, danger, info — soft + solid pairs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); }
  .wrap { padding: 22px 24px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; gap: 8px; }
  .pair { display: flex; height: 52px; border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-xs); }
  .pair .soft { flex: 1; }
  .pair .solid { width: 42%; }
  .lab { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="item">
        <div class="pair"><div class="soft" style="background:var(--status-success-soft)"></div><div class="solid" style="background:var(--status-success)"></div></div>
        <div class="lab">Success</div><div class="hex">#1F7A57</div>
      </div>
      <div class="item">
        <div class="pair"><div class="soft" style="background:var(--status-warning-soft)"></div><div class="solid" style="background:var(--status-warning)"></div></div>
        <div class="lab">Warning</div><div class="hex">#DB9426</div>
      </div>
      <div class="item">
        <div class="pair"><div class="soft" style="background:var(--status-danger-soft)"></div><div class="solid" style="background:var(--status-danger)"></div></div>
        <div class="lab">Danger</div><div class="hex">#C8412E</div>
      </div>
      <div class="item">
        <div class="pair"><div class="soft" style="background:var(--status-info-soft)"></div><div class="solid" style="background:var(--status-info)"></div></div>
        <div class="lab">Info</div><div class="hex">#2E6F8E</div>
      </div>
    </div>
  </div>
</body>
</html>
