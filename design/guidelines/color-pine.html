<!-- @dsCard group="Colors" viewport="700x190" name="Pine — brand primary" subtitle="Trust, security, the open-source spirit" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); }
  .wrap { padding: 22px 24px; }
  .ramp { display: grid; grid-template-columns: repeat(9, 1fr); gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-xs); }
  .sw { height: 74px; display: flex; align-items: flex-end; padding: 7px 8px; }
  .sw span { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.02em; }
  .meta { display: flex; justify-content: space-between; margin-top: 12px; }
  .meta b { font-size: var(--text-sm); color: var(--text-primary); }
  .meta code { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ramp">
      <div class="sw" style="background:var(--pine-50)"><span style="color:#114A37">50</span></div>
      <div class="sw" style="background:var(--pine-100)"><span style="color:#114A37">100</span></div>
      <div class="sw" style="background:var(--pine-200)"><span style="color:#0B2A20">200</span></div>
      <div class="sw" style="background:var(--pine-300)"><span style="color:#0B2A20">300</span></div>
      <div class="sw" style="background:var(--pine-400)"><span style="color:#F7F2E8">400</span></div>
      <div class="sw" style="background:var(--pine-500)"><span style="color:#F7F2E8">500</span></div>
      <div class="sw" style="background:var(--pine-600)"><span style="color:#F7F2E8">600</span></div>
      <div class="sw" style="background:var(--pine-700)"><span style="color:#F7F2E8">700</span></div>
      <div class="sw" style="background:var(--pine-900)"><span style="color:#F7F2E8">900</span></div>
    </div>
    <div class="meta">
      <b>Pine</b>
      <code>--action-primary = --pine-500 · #1F7A57</code>
    </div>
  </div>
</body>
</html>
