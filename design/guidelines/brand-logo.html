<!-- @dsCard group="Brand" viewport="700x200" name="Logo & mark" subtitle="The aperture / thought-node mark — light & dark lockups" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); }
  .wrap { padding: 26px; display: flex; align-items: center; gap: 34px; }
  .lockup { display: flex; align-items: center; gap: 13px; }
  .lockup img { width: 46px; height: 46px; }
  .word { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: -0.035em; color: var(--text-primary); }
  .ondark { background: var(--ink-900); border-radius: var(--radius-lg); padding: 18px 22px; display: flex; align-items: center; gap: 13px; }
  .ondark .word { color: var(--paper-50); }
  .ondark img { width: 40px; height: 40px; }
  .note { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); max-width: 150px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="lockup">
      <img src="../assets/noema-mark.svg" alt="Noema mark" />
      <span class="word">noema</span>
    </div>
    <div class="ondark">
      <img src="../assets/noema-mark-light.svg" alt="Noema mark on dark" />
      <span class="word">noema</span>
    </div>
    <div class="note">Wordmark set lowercase. Clear space ≥ mark height.</div>
  </div>
</body>
</html>
