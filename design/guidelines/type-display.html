<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); }
  .wrap { padding: 24px 26px; }
  .big { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 1.0; letter-spacing: -0.03em; color: var(--text-primary); margin: 0; }
  .sub { font-family: var(--font-display); font-weight: 600; font-size: 24px; letter-spacing: -0.015em; color: var(--text-secondary); margin: 14px 0 0; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 16px; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="big">Agents you own.</h1>
    <p class="sub">Thoughtfully built, end to end.</p>
    <div class="meta">Bricolage Grotesque · --font-display · 700 / 600</div>
  </div>
</body>
</html>
