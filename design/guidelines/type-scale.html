<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="11 → 80px, tuned major-third-ish steps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); }
  .wrap { padding: 20px 26px; }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 4px 0; }
  .line .spec { font-family: var(--font-display); color: var(--text-primary); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; }
  .line .tok { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="line"><span class="spec" style="font-size:48px">Noema</span><span class="tok">--text-3xl · 48</span></div>
    <div class="line"><span class="spec" style="font-size:36px">Noema</span><span class="tok">--text-2xl · 36</span></div>
    <div class="line"><span class="spec" style="font-size:28px">Noema</span><span class="tok">--text-xl · 28</span></div>
    <div class="line"><span class="spec" style="font-size:22px">Noema</span><span class="tok">--text-lg · 22</span></div>
    <div class="line"><span class="spec" style="font-size:18px;font-family:var(--font-sans);font-weight:500">Noema body lead</span><span class="tok">--text-md · 18</span></div>
    <div class="line"><span class="spec" style="font-size:16px;font-family:var(--font-sans);font-weight:400">Noema body default</span><span class="tok">--text-base · 16</span></div>
    <div class="line"><span class="spec" style="font-size:13px;font-family:var(--font-mono);font-weight:400">--text-sm · 14 · meta</span><span class="tok">--text-sm / xs / 2xs</span></div>
  </div>
</body>
</html>
