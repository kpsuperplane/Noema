<!-- @dsCard group="Colors" viewport="700x190" name="Clay — accent" subtitle="Warmth and friendliness; marketing CTAs & highlights" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); }
  .wrap { padding: 22px 24px; }
  .ramp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-xs); }
  .sw { height: 74px; display: flex; align-items: flex-end; padding: 7px 8px; }
  .sw span { font-family: var(--font-mono); font-size: 9.5px; }
  .meta { display: flex; justify-content: space-between; margin-top: 12px; }
  .meta b { font-size: var(--text-sm); color: var(--text-primary); }
  .meta code { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ramp">
      <div class="sw" style="background:var(--clay-50)"><span style="color:#97401F">50</span></div>
      <div class="sw" style="background:var(--clay-100)"><span style="color:#97401F">100</span></div>
      <div class="sw" style="background:var(--clay-300)"><span style="color:#97401F">300</span></div>
      <div class="sw" style="background:var(--clay-400)"><span style="color:#FBEDE3">400</span></div>
      <div class="sw" style="background:var(--clay-500)"><span style="color:#FBEDE3">500</span></div>
      <div class="sw" style="background:var(--clay-600)"><span style="color:#FBEDE3">600</span></div>
      <div class="sw" style="background:var(--clay-700)"><span style="color:#FBEDE3">700</span></div>
    </div>
    <div class="meta">
      <b>Clay</b>
      <code>--action-accent = --clay-500 · #D9663F</code>
    </div>
  </div>
</body>
</html>
