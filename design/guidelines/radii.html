<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Generous but not bubbly · 4 → 30px + pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); }
  .wrap { padding: 22px 26px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .box { width: 64px; height: 64px; background: var(--surface-brand-soft); border: 1.5px solid var(--pine-300); }
  .tok { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="col"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="tok">xs · 4</span></div>
      <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="tok">sm · 7</span></div>
      <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><span class="tok">md · 11</span></div>
      <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="tok">lg · 16</span></div>
      <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="tok">xl · 22</span></div>
      <div class="col"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="tok">2xl · 30</span></div>
      <div class="col"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="tok">pill</span></div>
    </div>
  </div>
</body>
</html>
