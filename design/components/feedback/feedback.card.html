<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); }
  .wrap { padding: 22px 24px; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; align-items: start; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  /* contain the dialog scrim inside the card preview */
  .dlg-host { position: relative; height: 230px; border-radius: var(--radius-lg); overflow: hidden; border: 1px dashed var(--border-default); }
  .dlg-host .noema-dialog__scrim { position: absolute; }
</style>
</head>
<body>
  <div id="root" class="wrap"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Dialog, Toast, Tooltip, Button, IconButton } = window.NoemaDesignSystem_3d237e;
    const Gear = () => <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.2" stroke="currentColor" strokeWidth="1.4"/><path d="M8 1.5v2M8 12.5v2M14.5 8h-2M3.5 8h-2" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;
    function Demo() {
      return (
        <>
          <div>
            <div className="lbl">Dialog</div>
            <div className="dlg-host">
              <Dialog open title="Grant filesystem access?"
                description="Research Agent is requesting read access to ~/Documents."
                footer={<><Button variant="ghost">Not now</Button><Button>Allow</Button></>}>
                Tools can be revoked anytime from Settings → Permissions.
              </Dialog>
            </div>
          </div>
          <div>
            <div className="lbl">Toast</div>
            <div className="stack">
              <Toast tone="success" title="Agent deployed" message="research-agent is now live." onClose={()=>{}} />

            </div>
            <div className="lbl" style={{marginTop:'18px'}}>Tooltip</div>
            <Tooltip label="New conversation" kbd="⌘N"><Button variant="secondary" size="sm">Hover me</Button></Tooltip>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
