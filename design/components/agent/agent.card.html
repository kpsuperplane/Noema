<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); }
  .wrap { padding: 18px 24px; }
  .thread { max-width: 600px; }
  .tools { margin: 4px 0 4px 36px; display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>
  <div id="root" class="wrap"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { ChatMessage, ToolCall, Avatar } = window.NoemaDesignSystem_3d237e;
    function Demo() {
      return (
        <div className="thread">
          <ChatMessage role="user" name="You" time="2:14 PM" avatar={<Avatar name="You" size="sm"/>}>
            Find the most-cited paper on retrieval-augmented generation and summarize it.
          </ChatMessage>
          <div className="tools">
            <ToolCall tool="web_search" status="success" args={{ query: "most cited RAG paper" }} result="4 results" />
            <ToolCall tool="fetch_url" status="running" />
          </div>
          <ChatMessage role="agent" name="Research Agent" time="2:14 PM"
            avatar={<Avatar kind="agent" square size="sm" name="RA"/>}>
            <p style={{margin:0}}>The most-cited work is <b>Lewis et&nbsp;al. (2020)</b>, which introduced RAG by pairing a retriever with a seq2seq generator. I'll pull the key contributions next.</p>
          </ChatMessage>
          <ChatMessage role="agent" typing avatar={<Avatar kind="agent" square size="sm" name="RA"/>} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
