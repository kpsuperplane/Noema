query SettingsSnapshot {
  localStatus {
    localService
    assistantConnection
    memoryStorage
    primaryAgentDisplayName
  }
  agents {
    agentId
    displayName
    isPrimary
    modelPreference {
      providerKind
      providerAccountId
      modelProfile
      reasoningEffort
      selectionMode
    }
    modelOptions {
      providerKind
      providerAccountId
      providerDisplayName
      status
      disabledReason
      profiles {
        id
        label
        reasoningEfforts
        defaultReasoningEffort
        disabledReason
      }
      recommendations {
        useCase
        modelProfile
        reasoningEffort
        disabledReason
      }
    }
  }
  memorySettings {
    modelPreference {
      providerKind
      providerAccountId
      modelProfile
      reasoningEffort
      selectionMode
    }
    modelOptions {
      providerKind
      providerAccountId
      providerDisplayName
      status
      disabledReason
      profiles {
        id
        label
        reasoningEfforts
        defaultReasoningEffort
        disabledReason
      }
      recommendations {
        useCase
        modelProfile
        reasoningEffort
        disabledReason
      }
    }
  }
  webFetchSettings {
    summarizer {
      modelPreference {
        providerKind
        providerAccountId
        modelProfile
        reasoningEffort
        selectionMode
      }
      modelOptions {
        providerKind
        providerAccountId
        providerDisplayName
        status
        disabledReason
        profiles {
          id
          label
          reasoningEfforts
          defaultReasoningEffort
          disabledReason
        }
        recommendations {
          useCase
          modelProfile
          reasoningEffort
          disabledReason
        }
      }
    }
  }
  webToolSettings {
    search {
      toolName
      capabilityId
      activeProviderAccountId
      providerOptions {
        providerAccountId
        providerKind
        accountKey
        displayName
        capabilityId
        reliabilityContract
        dataFlowClass
        citations
        directUrlFetch
        jsRendering
        authenticatedContext
      }
    }
    fetch {
      toolName
      capabilityId
      activeProviderAccountId
      providerOptions {
        providerAccountId
        providerKind
        accountKey
        displayName
        capabilityId
        reliabilityContract
        dataFlowClass
        citations
        directUrlFetch
        jsRendering
        authenticatedContext
      }
    }
    browse {
      toolName
      capabilityId
      activeProviderAccountId
      providerOptions {
        providerAccountId
        providerKind
        accountKey
        displayName
        capabilityId
        reliabilityContract
        dataFlowClass
        citations
        directUrlFetch
        jsRendering
        authenticatedContext
      }
    }
  }
  privacySettings {
    reviewer {
      modelPreference {
        providerKind
        providerAccountId
        modelProfile
        reasoningEffort
        selectionMode
      }
      modelOptions {
        providerKind
        providerAccountId
        providerDisplayName
        status
        disabledReason
        profiles {
          id
          label
          reasoningEfforts
          defaultReasoningEffort
          disabledReason
        }
        recommendations {
          useCase
          modelProfile
          reasoningEffort
          disabledReason
        }
      }
    }
  }
  usageSettings {
    progressAudit {
      modelPreference {
        providerKind
        providerAccountId
        modelProfile
        reasoningEffort
        selectionMode
      }
      modelOptions {
        providerKind
        providerAccountId
        providerDisplayName
        status
        disabledReason
        profiles {
          id
          label
          reasoningEfforts
          defaultReasoningEffort
          disabledReason
        }
        recommendations {
          useCase
          modelProfile
          reasoningEffort
          disabledReason
        }
      }
    }
  }
  taskExecutionPolicy {
    maxProviderContinuations
    maxToolCalls
    maxActiveMinutes
    progressAuditInterval
    maxAutomaticRetries
    maxReviewRounds
  }
  localModelSetup {
    isReady
    runtimeStatus
    recommendedModel {
      modelId
      name
      license
      priority
      repo
      revision
      isRecommended
      compatibleBackend
      selectedBuild {
        file
        sha256
        downloadGb
        backends
        minRamGb
        minVramGb
      }
      hardwareFit {
        backend
        ramGb
        vramGb
        unifiedMemory
        explanation
      }
    }
    installation {
      installationId
      modelId
      name
      file
      sourceKind
      status
      sha256
      completedBytes
      totalBytes
      diskBytes
      backend
      isActive
      errorCode
      errorMessage
      createdAt
      updatedAt
    }
  }
  localModelCatalog {
    modelId
    name
    license
    priority
    repo
    revision
    isRecommended
    compatibleBackend
    selectedBuild {
      file
      sha256
      downloadGb
      backends
