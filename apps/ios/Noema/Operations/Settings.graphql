    }
  }
}

query SettingsMcpOauthSetupAttempt($attemptId: String!) {
  mcpOauthSetupAttempt(attemptId: $attemptId) {
    attemptId
    status
    authorizationUrl
    errorMessage
    setupResult {
      ...SettingsMcpSetupResultFields
