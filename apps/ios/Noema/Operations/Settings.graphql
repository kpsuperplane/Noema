    errorMessage
    createdAt
    updatedAt
  }
  defaultModelPreference {
    providerKind
    providerAccountId
    selectionMode
    modelProfile
    reasoningEffort
  }
  providerAccountCatalog {
    providerKind
    displayName
    preferredAuthMethod
    supportedAuthMethods
    capabilities {
      capabilityId
      status
      reliabilityContract
      dataFlowClass
    }
  }
  providerAccounts {
    providerAccountId
    providerKind
    accountKey
    displayName
    authMethod
    status
    isActive
    isDefault
    lastCheckedAt
    lastAuthenticatedAt
    lastErrorCode
    lastErrorMessage
    capabilities {
      capabilityId
      status
      reliabilityContract
      dataFlowClass
    }
  }
  mcps: capabilityIntegrations(kind: MCP) {
    kind
    definitionId
    name
    sourceRevision
    reviewed
    sourceSummary
    connections {
      kind
      definitionId
      connectionId
      name
      connectionLabel
      sourceRevision
      connectionRevision
      credentialRevision
      grantRevision
      policyRevision
      status
      healthStatus
      authStatus
      dataSharingPolicy
      unsafeActionPolicy
      toolCount
      availableToolCount
      pendingToolCount
      defaultedToolCount
      disabledToolCount
      sourceDetails
    }
  }
  apis: capabilityIntegrations(kind: API) {
    kind
    definitionId
    name
    sourceRevision
    reviewed
    sourceSummary
    connections {
      kind
      definitionId
      connectionId
      name
      connectionLabel
      sourceRevision
      connectionRevision
      credentialRevision
      grantRevision
      policyRevision
      status
      healthStatus
      authStatus
      dataSharingPolicy
      unsafeActionPolicy
      toolCount
      availableToolCount
      pendingToolCount
      defaultedToolCount
      disabledToolCount
      sourceDetails
    }
  }
  mcpServers {
    mcpServerId
    connectionRevision
    policyRevision
    displayName
    transportKind
    healthStatus
    authStatus
    toolCount
    pendingToolCount
    browserOauthReauthenticationSupported
  }
}

query NativeTaskModelPools {
  taskModelPools {
    poolEntryId
    complexity
    label
    providerKind
    providerAccountId
    modelProfile
    reasoningEffort
    selectionMode
    enabled
    sortOrder
    createdAt
    updatedAt
  }
}

mutation NativeUpdateTaskModelPoolEntry($poolEntryId: String!, $input: TaskModelPoolEntryInput!) {
  updateTaskModelPoolEntry(poolEntryId: $poolEntryId, input: $input) {
    poolEntryId
    complexity
    label
    providerKind
    providerAccountId
    modelProfile
    reasoningEffort
    selectionMode
    enabled
    sortOrder
    createdAt
    updatedAt
  }
}

query CapabilityConnection($ref: CapabilityConnectionRefInput!) {
  capabilityConnection(ref: $ref) {
    kind
    definitionId
    connectionId
    name
    connectionLabel
    sourceRevision
    connectionRevision
    credentialRevision
    grantRevision
    policyRevision
    status
    healthStatus
    authStatus
    dataSharingPolicy
    unsafeActionPolicy
    toolCount
    availableToolCount
    pendingToolCount
    defaultedToolCount
    disabledToolCount
    sourceDetails
  }
  capabilityTools(ref: $ref) {
    kind
    connectionId
    toolId
    name
    description
    enabled
    readOnly { value source }
    idempotent { value source }
    destructive { value source }
    openWorld { value source }
    status
    policyRevision
    sourceRevision
    decisionPreview
    sourceDetails
  }
}

fragment AdapterCredentialSetupFields on AdapterCredentialSetup {
  credentialType
  setupUrl
  instructions
  inputKind
  fields {
    fieldId
    label
  }
  documentMediaType
  redirectUri
  normalizationTransform {
    language
    sourceDigest
    source
  }
  requestAuthTransform {
    language
    sourceDigest
    source
  }
}

fragment SettingsAdapterDefinitionFields on AdapterDefinition {
    semanticDigest
    definitionId
    adapterId
    displayName
    definitionRevision
    sourceReference
    origin
    authenticationMode
    scopes
    credentialSetup {
      ...AdapterCredentialSetupFields
    }
    accountIdentityOperationId
    operations {
      operationId
      method
      path
      readOnly
      idempotent
      destructive
      openWorld
      argumentNames
      responseTransform {
        language
        sourceDigest
        source
        acceptedContentTypes
        outputSchemaJson
      }
    }
    connectionCount
    connections {
      connectionId
      status
      accountKind
      connectionRevision
      credentialRevision
      grantRevision
      policyRevision
      grantedScopes
      allowedOperations
      policyConfigured
    }
    reviewed
    superseded
}

query SettingsAdapterDefinitions {
  adapterDefinitions {
    ...SettingsAdapterDefinitionFields
  }
}

mutation SettingsApproveAdapterDefinition($input: ApproveAdapterDefinitionInput!) {
  approveAdapterDefinition(input: $input) {
    ...SettingsAdapterDefinitionFields
  }
}

mutation SettingsCancelAdapterDefinition($input: CancelAdapterDefinitionInput!) {
  cancelAdapterDefinition(input: $input)
}

mutation SettingsSetupAdapterConnection($input: SetupAdapterConnectionInput!) {
  setupAdapterConnection(input: $input) {
    ...SettingsAdapterDefinitionFields
  }
}

mutation SettingsStartAdapterOauthSetup($input: StartAdapterOauthSetupInput!) {
  startAdapterOauthSetup(input: $input) {
    attemptId
    authorizationUrl
    expiresAtEpochSeconds
  }
}

mutation SettingsDeleteAdapterConnection($input: DeleteAdapterConnectionInput!) {
  deleteAdapterConnection(input: $input)
}

mutation SettingsDeleteAdapterService($input: DeleteAdapterServiceInput!) {
  deleteAdapterService(input: $input)
}

fragment SettingsMcpSetupResultFields on McpServerSetupResult {
  server {
    mcpServerId
    connectionRevision
    policyRevision
    displayName
    transportKind
    healthStatus
    authStatus
    toolCount
    pendingToolCount
    browserOauthReauthenticationSupported
  }
  setupStatus
  discoveryStatus
  discoveredToolCount
  setupError
  auth {
    oauthClientCredentialsSupported
    oauthAuthorizationSupported
    scopes
  }
}

mutation SettingsAddMcpConnection($input: AddMcpConnectionInput!) {
  addMcpConnection(input: $input) {
    ...SettingsMcpSetupResultFields
  }
}

mutation SettingsCreateMcpServer($input: CreateMcpServerInput!) {
  createMcpServer(input: $input) {
    ...SettingsMcpSetupResultFields
  }
}

mutation SettingsContinueMcpServerSetup($input: ContinueMcpServerSetupInput!) {
  continueMcpServerSetup(input: $input) {
    ...SettingsMcpSetupResultFields
  }
}

mutation SettingsStartMcpServerOauthSetup($input: StartMcpServerOAuthSetupInput!) {
  startMcpServerOauthSetup(input: $input) {
    attemptId
    status
    authorizationUrl
    errorMessage
    setupResult {
      ...SettingsMcpSetupResultFields
    }
  }
}

mutation SettingsStartMcpServerReauthenticationOauthSetup($input: StartMcpServerReauthenticationOAuthSetupInput!) {
  startMcpServerReauthenticationOauthSetup(input: $input) {
    attemptId
    status
    authorizationUrl
    errorMessage
    setupResult {
