subscription ConversationEvents($conversationId: String!) {
  conversationEvents(conversationId: $conversationId) {
    __typename
    ... on SubscriptionReadyEvent { conversationId }
    ... on HumanInterventionsChangedEvent { conversationId }
    ... on ConversationItemEvent {
      conversationId
      clientMessageId
      itemId
      cursor
      itemTurnId: turnId
      metadata
      item {
        __typename
        ... on UserText { text }
        ... on AssistantText { text }
        ... on Activity {
          id
          activityKind
          status
          title
          summary
          metadata
        }
        ... on A2UISurface {
          id
          interactionId
          surfaceId
          version
          revision
          interactionRevision
          lifecycle
          catalog
          snapshot
          hasActions
        }
        ... on MultipleChoicePrompt {
          prompt
          selectionMode
          options { id label }
        }
        ... on MultipleChoiceSelection {
          promptItemId
          selectionMode
          selectedOptions { id label }
        }
        ... on ErrorNotice { message recoverable }
        ... on ArtifactReference {
          artifactId
          artifactVersionId
          title
          artifactKind
          storageKind
          externalUrl
          downloadUrl
          mediaType
        }
        ... on TaskReference {
          taskId
          task { ...TasksTaskReferenceSummaryFields }
        }
      }
    }
    ... on AssistantTextDeltaEvent {
      conversationId
      deltaTurnId: turnId
      streamId
      responseIndex
      delta
    }
    ... on AgentStatusEvent {
      conversationId
      status
    }
    ... on TurnCompletedEvent {
      conversationId
      clientMessageId
    }
  }
}

query PendingChatInterventions($conversationId: String, $taskId: String, $projectId: String, $first: Int = 50) {
  pendingHumanInterventions(conversationId: $conversationId, taskId: $taskId, projectId: $projectId, first: $first) {
    __typename
    ... on TaskAttention {
      kind
      title
      summary
      gate { ...TasksGateFields }
      task { ...TasksTaskCardFields }
      validActions
    }
    ... on GovernedAction {
      actionId
      revision
      governedConversationId: conversationId
      taskId
      runId
      capabilityName
      reviewRoute
      behavior { readOnly idempotent destructive openWorld }
      safeSummary
      target { serviceName connectionLabel serviceId connectionId accountId }
      disclosure { recipient contentSummary }
      consequence
      arguments
      governedState: state
      output
      failureCode
    }
    ... on McpAuthenticationIntervention {
      requestId
      revision
      mcpAuthConversationId: conversationId
      taskId
      runId
      mcpAuthServerId: mcpServerId
      serverDisplayName
      capabilityName
      mcpAuthState: state
      failureCode
    }
    ... on AdapterAuthenticationIntervention {
      requestId
      revision
      adapterAuthConversationId: conversationId
      taskId
      runId
      adapterConnectionId
      serviceDisplayName
      capabilityName
      adapterAuthState: state
      failureCode
    }
    ... on McpSetupIntervention {
      itemId
      setupConversationId: conversationId
      setupStatus
      displayName
      description
      serviceUrl
      endpointUrl
      oauthSupported
      discoveredToolCount
      setupMcpServerId: mcpServerId
      connectionRevision
      policyRevision
      toolCount
    }
    ... on AdapterOauthClientSetupIntervention {
      profileDigest
      displayName
      oauthCredentialSetup: credentialSetup { ...AdapterCredentialSetupFields }
      dependentDefinitions { semanticDigest displayName }
    }
    ... on AdapterDefinition {
      semanticDigest
      definitionId
      adapterId
      displayName
      definitionRevision
      sourceReference
      origin
      authenticationMode
      oauthProfileDigest
      scopes
      credentialSetup {
        ...AdapterCredentialSetupFields
      }
      accountIdentityOperationId
      connectionCount
      reviewed
      superseded
      nextAction {
        kind
        semanticDigest
        applicationId
        expectedApplicationRevision
        grantId
        expectedGrantRevision
        connectionId
        expectedConnectionRevision
        expectedPolicyRevision
        operationIds
        missingScopes
      }
      connections {
        connectionId
        status
        grantId
        accountId
        connectionRevision
        credentialRevision
        grantRevision
        policyRevision
        grantedScopes
        allowedOperations
        policyConfigured
        operationAccess { operationId status missingScopes }
      }
      transition {
        addedOperations
        changedOperations
        removedOperations
        authenticationChanged
        affectedConnections
        authenticationRequiredConnections
        consolidatedConnections
      }
      operations {
        operationId
        method
        path
        readOnly
        idempotent
        destructive
        openWorld
        argumentNames
        responseTransform {
          language
          sourceDigest
          source
          acceptedContentTypes
          outputSchemaJson
        }
      }
    }
  }
}

