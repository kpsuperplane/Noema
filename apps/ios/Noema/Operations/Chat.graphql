fragment NativeConversationItemFields on ConversationItem {
  itemId
  cursor
  turnId
  metadata
  item {
    __typename
    ... on UserText { text }
    ... on AssistantText { text }
    ... on Activity {
      id
      activityKind
      status
      title
      summary
      metadata
    }
    ... on A2UISurface {
      id
      interactionId
      surfaceId
      version
      revision
      interactionRevision
      lifecycle
      catalog
      snapshot
      hasActions
    }
    ... on MultipleChoicePrompt {
      prompt
      selectionMode
      options { id label }
    }
    ... on MultipleChoiceSelection {
      promptItemId
      selectionMode
      selectedOptions { id label }
    }
    ... on ErrorNotice {
      message
      recoverable
    }
    ... on ArtifactReference {
      artifactId
      artifactVersionId
      title
      artifactKind
      storageKind
      externalUrl
      downloadUrl
      mediaType
    }
    ... on TaskReference {
      taskId
      task { ...TasksTaskReferenceSummaryFields }
    }
  }
}

fragment NativeConversationPageFields on ConversationTranscriptPage {
  items { ...NativeConversationItemFields }
  pageInfo {
    beforeCursor
    hasMoreBefore
    limit
  }
}

query ChatBoot {
  localStatus {
    localService
    assistantConnection
    memoryStorage
    primaryAgentDisplayName
  }
  onboardingStatus {
    isUserOnboarded
    steps {
      id
      status
      providerKind
      providerAccountId
      accountKey
      displayName
      providerAccountStatus
      authMethod
    }
  }
  providerAccountCatalog {
    providerKind
    displayName
    preferredAuthMethod
    supportedAuthMethods
  }
  providerAccounts {
    providerAccountId
    providerKind
    accountKey
    displayName
    authMethod
    status
    isActive
    isDefault
    lastCheckedAt
    lastAuthenticatedAt
    lastErrorCode
    lastErrorMessage
  }
}

query PrimaryConversation {
  primaryConversation {
    conversationId
    provider
  }
}

mutation EnsurePrimaryConversation {
  ensurePrimaryConversation {
    conversationId
    provider
  }
}

query ConversationTranscriptPage($input: ConversationTranscriptPageInput!) {
  conversationTranscriptPage(input: $input) {
    ...NativeConversationPageFields
  }
}

