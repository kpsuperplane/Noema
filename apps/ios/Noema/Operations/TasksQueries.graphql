query TasksOverview($workspaceId: String!, $projectId: String) {
  tasksOverview(workspaceId: $workspaceId, projectId: $projectId) {
    workspace { ...TasksWorkspaceFields }
    workflow {
      workflowId
      name
      stages { ...TasksStageFields }
    }
    boardColumns {
      stage { ...TasksStageFields }
      taskCount
    }
    recentTasks {
      edges {
        cursor
        node { ...TasksTaskSummaryFields }
      }
      pageInfo { ...TasksPageInfoFields }
    }
    needsYouCount
  }
}

query TasksProjects($workspaceId: String!, $includeArchived: Boolean! = false, $first: Int = 100, $after: String) {
  projects(workspaceId: $workspaceId, includeArchived: $includeArchived, first: $first, after: $after) {
    edges {
      cursor
      node { ...TasksProjectFields }
    }
    pageInfo { ...TasksPageInfoFields }
  }
}

query TasksSchedulePreview($input: TaskSchedulePreviewInput!) {
  taskSchedulePreview(input: $input) {
    resolvedStart
    occurrences
  }
}

query TasksTaskRecurrence($recurrenceId: String!, $first: Int = 30) {
  taskRecurrence(recurrenceId: $recurrenceId, first: $first) {
    recurrenceId
    title
    taskDocument
    taskDocumentDigest
    startsAt
    cronExpression
    timeZone
    missedRunPolicy
    overlapPolicy
    lifecycle
    revision
    nextRunAt
    pendingCoalescedAt
    occurrences {
      recurrenceRevision
      scheduledFor
      localSlot
      trigger
      resolution
      taskId
      createdAt
    }
  }
}

query TasksList($input: TaskListInput!, $first: Int = 50, $after: String) {
  tasks(input: $input, first: $first, after: $after) {
    edges {
      cursor
      node { ...TasksTaskSummaryFields }
    }
    pageInfo { ...TasksPageInfoFields }
  }
}

query TasksNeedsYou($workspaceId: String!, $projectId: String, $first: Int = 50, $after: String) {
  needsYou(workspaceId: $workspaceId, projectId: $projectId, first: $first, after: $after) {
    edges {
      cursor
      node {
        kind
        title
        summary
        validActions
        gate { ...TasksGateFields }
        task { ...TasksTaskCardFields }
      }
    }
    pageInfo { ...TasksPageInfoFields }
  }
}

query TasksHistory($workspaceId: String!, $projectId: String, $kind: TerminalTaskKind, $first: Int = 50, $after: String) {
  taskHistory(workspaceId: $workspaceId, projectId: $projectId, kind: $kind, first: $first, after: $after) {
    edges {
      cursor
      node { ...TasksTaskSummaryFields }
    }
    pageInfo { ...TasksPageInfoFields }
  }
}

query TasksDetailCore($taskId: String!) {
  task(taskId: $taskId) { ...TasksDetailCoreFields }
}

query TasksDetailActivity($taskId: String!) {
  task(taskId: $taskId) { ...TasksDetailActivityFields }
}

query TasksDetailOutcome($taskId: String!) {
  task(taskId: $taskId) { ...TasksDetailOutcomeFields }
}

query TasksRunItems($runId: String!, $first: Int = 50, $after: String) {
  taskRunItems(runId: $runId, first: $first, after: $after) {
    edges {
      cursor
      node {
        itemId
        runId
        cursor
        sequenceIndex
        roundIndex
        kind
        status
        correlationId
        parentItemId
        contentText
        payload
        createdAt
        updatedAt
      }
    }
    pageInfo { ...TasksPageInfoFields }
  }
}
