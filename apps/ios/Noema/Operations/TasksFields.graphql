    criterionId
    ordinal
    description
    expectedEvidence
  }
  complexity
  executionPolicy { ...TasksPolicyFields }
  executorAgentId
  executorBackend
  effectiveCwd
}

fragment TasksSubmissionFields on TaskSubmission {
  submissionId
  contractId
  executorRunId
  reviewRound
  summary
  resultMarkdown
  criteria {
    criterionId
    evidenceMarkdown
  }
  artifacts {
    artifactId
    artifactVersionId
    title
    artifactKind
    storageKind
    mediaType
    downloadUrl
    externalUrl
  }
  createdAt
}

fragment TasksReviewFields on TaskReview {
  reviewId
  contractId
  reviewerRunId
  reviewedSubmissionId
  reviewAttemptIndex
  supersedesReviewId
  verdict
  feedback
  criteria {
    criterionId
    outcome
    evidenceMarkdown
    feedback
  }
  createdAt
}

fragment TasksRunFields on TaskRun {
  runId
  instanceName
  kind
  status
  agentId
  taskGeneration
  contractId
  attemptIndex
  reviewRound
  parentRunId
  triggeringSubmissionId
  triggeringReviewId
  model {
    providerKind
    providerAccountId
    providerInstanceKey
    selectionMode
    modelProfile
    reasoningEffort
    selectionSource
