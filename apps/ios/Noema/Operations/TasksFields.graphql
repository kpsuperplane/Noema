  actualModelProfile
  executionPolicy { ...TasksPolicyFields }
  errorCode
  errorMessage
  providerCallCount
  toolCallCount
  inputTokens
  cachedInputTokens
  outputTokens
  activeMilliseconds
  queuedAt
  startedAt
  endedAt
  createdAt
  updatedAt
}

fragment TasksCommandTaskFields on TaskDetail {
  taskId
  title
  description
  executorAgentId
  executorBackend
  cwdOverride
  effectiveCwd
  effectiveCwdSource
  stage { ...TasksStageFields }
  revision
  generation
  updatedAt
  schedule { scheduledFor timeZone missedRunPolicy recurrenceId recurrenceRevision recurrenceScheduledFor }
  completedAt
  validActions
  activeGate { ...TasksGateFields }
  currentRun { ...TasksCurrentRunFields }
}

fragment TasksEventFields on TasksEvent {
