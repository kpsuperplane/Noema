}

fragment TasksTaskCardFields on TaskCard {
  taskId
  workspace { ...TasksWorkspaceFields }
  project { ...TasksProjectFields }
  title
  descriptionPreview
  executorAgentId
  executorBackend
  cwdOverride
  effectiveCwd
  effectiveCwdSource
  schedule { scheduledFor timeZone missedRunPolicy recurrenceId recurrenceRevision recurrenceScheduledFor }
  stage { ...TasksStageFields }
  revision
  generation
  createdAt
  updatedAt
  completedAt
  currentRun { ...TasksCurrentRunFields }
  activeGate { ...TasksGateFields }
  latestReview { ...TasksReviewSummaryFields }
  validActions
}

fragment TasksTaskSummaryFields on TaskSummary {
  taskId
  workspace { ...TasksWorkspaceFields }
  project { ...TasksProjectFields }
  title
  descriptionPreview
  executorAgentId
  executorBackend
  cwdOverride
  effectiveCwd
  effectiveCwdSource
  schedule { scheduledFor timeZone missedRunPolicy recurrenceId recurrenceRevision recurrenceScheduledFor }
  stage { ...TasksStageFields }
  revision
  generation
  createdAt
  updatedAt
  completedAt
  currentRun { ...TasksCurrentRunFields }
  activeGate { ...TasksGateFields }
  latestReview { ...TasksReviewSummaryFields }
  attention {
    kind
    title
    summary
    validActions
    gate { ...TasksGateFields }
  }
  validActions
}

fragment TasksPolicyFields on TaskExecutionPolicy {
  maxProviderContinuations
  maxToolCalls
  maxActiveMinutes
  progressAuditInterval
  maxAutomaticRetries
  maxReviewRounds
}

fragment TasksContractFields on TaskExecutionContract {
  requestMarkdown
