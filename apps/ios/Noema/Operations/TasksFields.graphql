  resolvedBy
  resolvedAt
  resolution
}

fragment TasksReviewSummaryFields on TaskReviewSummary {
  reviewId
  reviewedSubmissionId
  reviewAttemptIndex
  supersedesReviewId
  verdict
  feedback
  createdAt
}

fragment TasksCurrentRunFields on CurrentRunSummary {
  runId
  instanceName
  kind
  status
  attemptIndex
