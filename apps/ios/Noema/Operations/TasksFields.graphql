fragment TasksPageInfoFields on PageInfo {
  endCursor
  hasNextPage
}

fragment TasksProjectFields on Project {
  projectId
  workspaceId
  name
  description
  folder
  revision
  archivedAt
  createdAt
  updatedAt
}

fragment TasksWorkspaceFields on Workspace {
  workspaceId
  name
  description
  isPersonal
  membershipRole
}

fragment TasksStageFields on WorkflowStage {
  stageId
  workflowId
  key
  name
  displayOrder
  behavior
}

fragment TasksGateFields on TaskGate {
  gateId
  taskGeneration
  kind
  state
  recoveryReason
  retryRunKind
  prompt
  contextMarkdown
  suggestedAnswers
  openedBy
  originatingRunId
  openedAt
  resolvedBy
  resolvedAt
  resolution
}

fragment TasksCurrentRunFields on CurrentRunSummary {
  runId
  instanceName
  kind
  status
  attemptIndex
  queuedAt
  startedAt
  updatedAt
  activityLabel
}

fragment TasksTaskReferenceSummaryFields on TaskSummary {
  taskId
  title
  stage {
    stageId
    name
    behavior
  }
  completedAt
  currentRun {
    runId
    kind
    activityLabel
  }
  attention {
    title
  }
}

fragment TasksTaskCardFields on TaskCard {
  taskId
  workspace { ...TasksWorkspaceFields }
  project { ...TasksProjectFields }
  title
  taskDocumentPreview
  executorAgentId
  executorBackend
  cwdOverride
  effectiveCwd
  effectiveCwdSource
  schedule { scheduledFor timeZone missedRunPolicy recurrenceId recurrenceRevision recurrenceScheduledFor }
  stage { ...TasksStageFields }
  revision
  generation
  createdAt
  updatedAt
  completedAt
  currentRun { ...TasksCurrentRunFields }
  activeGate { ...TasksGateFields }
  validActions
}

fragment TasksTaskSummaryFields on TaskSummary {
  taskId
  workspace { ...TasksWorkspaceFields }
  project { ...TasksProjectFields }
  title
  taskDocumentPreview
  executorAgentId
  executorBackend
  cwdOverride
  effectiveCwd
  effectiveCwdSource
  schedule { scheduledFor timeZone missedRunPolicy recurrenceId recurrenceRevision recurrenceScheduledFor }
  stage { ...TasksStageFields }
  revision
  generation
  createdAt
  updatedAt
  completedAt
  currentRun { ...TasksCurrentRunFields }
  activeGate { ...TasksGateFields }
  attention {
    kind
    title
    summary
    validActions
    gate { ...TasksGateFields }
  }
  validActions
}

fragment TasksPolicyFields on TaskExecutionPolicy {
  maxProviderContinuations
  maxToolCalls
  maxActiveMinutes
  progressAuditInterval
  maxAutomaticRetries
  maxReviewRounds
}

fragment TasksRunFields on TaskRun {
  runId
  instanceName
  kind
  status
  agentId
  taskGeneration
  attemptIndex
  reviewRound
  parentRunId
  model {
    providerKind
    providerAccountId
    providerInstanceKey
    selectionMode
    modelProfile
    reasoningEffort
    selectionSource
  }
  actualProviderKind
  actualModelProfile
  executionPolicy { ...TasksPolicyFields }
  errorCode
  errorMessage
  providerCallCount
  toolCallCount
  inputTokens
  cachedInputTokens
  outputTokens
  activeMilliseconds
  queuedAt
  startedAt
  endedAt
  createdAt
  updatedAt
}

fragment TasksCommandTaskFields on TaskDetail {
  taskId
  title
  taskDocument
  taskDocumentDigest
  executorAgentId
  executorBackend
  cwdOverride
  effectiveCwd
  effectiveCwdSource
  stage { ...TasksStageFields }
  revision
  generation
  updatedAt
  schedule { scheduledFor timeZone missedRunPolicy recurrenceId recurrenceRevision recurrenceScheduledFor }
  completedAt
  validActions
  activeGate { ...TasksGateFields }
  currentRun { ...TasksCurrentRunFields }
}

fragment TasksDetailCoreFields on TaskDetail {
  ...TasksCommandTaskFields
  project { ...TasksProjectFields }
  createdAt
  source { conversationId }
}

fragment TasksDetailActivityFields on TaskDetail {
  taskId
  contributorInstanceNames
  messages {
    messageId
    bodyMarkdown
    author
    createdAt
  }
  runs { ...TasksRunFields }
}

fragment TasksDetailOutcomeFields on TaskDetail {
  taskId
  taskDocument
  taskDocumentDigest
  resultDocument
  resultMetadata
  reviewDocument
}

fragment TasksEventFields on TasksEvent {
  cursor
  eventId
  kind
  occurredAt
  workspaceId
  projectId
  taskId
  runId
  actor
  causationId
  correlationId
  payload
}
