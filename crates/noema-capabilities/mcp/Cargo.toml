[package]
name = "noema-capabilities-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
transport = [
    "dep:bytes",
    "dep:futures-util",
    "dep:http",
    "dep:nix",
    "dep:process-wrap",
    "dep:reqwest",
    "dep:rmcp",
    "dep:sse-stream",
    "dep:time",
    "dep:tokio",
    "dep:tokio-util",
    "dep:url",
]

[dependencies]
bytes = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
http = { workspace = true, optional = true }
noema-capabilities = { path = "..", default-features = false }
noema-home = { path = "../../noema-home" }
process-wrap = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
ring.workspace = true
rmcp = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sse-stream = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true, features = ["codec"] }
url = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
