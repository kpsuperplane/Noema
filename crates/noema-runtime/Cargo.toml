[package]
name = "noema-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
eval-support = []
test-support = []

[dependencies]
agent-client-protocol.workspace = true
cap-std.workspace = true
futures-util.workspace = true
jiff.workspace = true
jsonschema.workspace = true
noema-artifacts = { path = "../noema-artifacts", default-features = false }
noema-capabilities = { path = "../noema-capabilities", default-features = false }
noema-conversations = { path = "../noema-conversations", default-features = false }
noema-home = { path = "../noema-home", default-features = false }
noema-memory = { path = "../noema-memory", default-features = false }
noema-providers = { path = "../noema-providers", default-features = false }
noema-store = { path = "../noema-store", default-features = false }
noema-tasks = { path = "../noema-tasks", default-features = false }
noema-workspaces = { path = "../noema-workspaces", default-features = false }
ring.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
ts-rs.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
noema-artifacts = { path = "../noema-artifacts", default-features = false, features = ["filesystem"] }
noema-store = { path = "../noema-store", default-features = false, features = ["test-support"] }
tempfile.workspace = true
