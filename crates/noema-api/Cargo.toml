[package]
name = "noema-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
async-graphql.workspace = true
async-stream.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
noema-artifacts = { path = "../noema-artifacts", default-features = false }
noema-capabilities = { path = "../noema-capabilities", default-features = false }
noema-capabilities-mcp = { path = "../noema-capabilities/mcp", default-features = false }
noema-conversations = { path = "../noema-conversations", default-features = false }
noema-host = { path = "../noema-host", default-features = false }
noema-memory = { path = "../noema-memory", default-features = false }
noema-providers = { path = "../noema-providers", default-features = false }
noema-runtime = { path = "../noema-runtime", default-features = false }
noema-store = { path = "../noema-store", default-features = false }
noema-tasks = { path = "../noema-tasks", default-features = false }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
ts-rs.workspace = true

[dev-dependencies]
noema-artifacts = { path = "../noema-artifacts", default-features = false, features = ["filesystem"] }
noema-home = { path = "../noema-home", default-features = false }
noema-memory = { path = "../noema-memory", default-features = false, features = ["service"] }
noema-providers = { path = "../noema-providers", default-features = false, features = ["adapters", "local-models"] }
noema-runtime = { path = "../noema-runtime", default-features = false, features = ["test-support"] }
noema-store = { path = "../noema-store", default-features = false, features = ["test-support"] }
tempfile.workspace = true
