"""
Conversation subscription event union.
"""
union GraphqlConversationEvent = GraphqlSubscriptionReadyEvent | GraphqlConversationItemEvent | GraphqlAssistantTextDeltaEvent | GraphqlAgentStatusEvent | GraphqlTurnCompletedEvent

