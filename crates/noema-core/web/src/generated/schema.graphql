}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

type MutationRoot {
	"""
	Start a provider auth attempt.
	"""
	startProviderAuthAttempt(input: GraphqlStartProviderAuthAttemptInput!): GraphqlProviderAuthAttempt!
	"""
	Start or resume the primary conversation.
	"""
	startPrimaryConversation(model: String, cwd: String): GraphqlConversationStarted!
	"""
	Send a conversation turn.
	"""
	sendConversationTurn(input: GraphqlSendConversationTurnInput!): GraphqlTurnAccepted!
}

type QueryRoot {
	"""
	Return local Noema status.
	"""
	localStatus: GraphqlLocalStatus!
	"""
	Return onboarding status.
	"""
	onboardingStatus: GraphqlOnboardingStatus!
	"""
	Return a short-lived provider auth attempt.
	"""
	providerAuthAttempt(attemptId: String!): GraphqlProviderAuthAttempt
	"""
	List graph-memory claims for memory-management inspection.
	"""
	memoryClaims(query: String, status: String, predicateId: String, limit: Int): [GraphqlMemoryClaim!]!
	"""
	Return one graph-memory claim for memory-management inspection.
	"""
	memoryClaim(claimId: String!): GraphqlMemoryClaimDetail
	"""
	Return a bounded graph-memory projection for memory-management inspection.
	"""
	memoryGraph(input: GraphqlMemoryGraphInput): GraphqlMemoryGraph!
}

type SubscriptionRoot {
	"""
	Stream conversation events.
	"""
	conversationEvents(conversationId: String!): GraphqlConversationEvent!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
	mutation: MutationRoot
	subscription: SubscriptionRoot
}
