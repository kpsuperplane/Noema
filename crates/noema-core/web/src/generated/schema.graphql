"""
Structured card transcript item.
"""
type GraphqlA2UiCard {
	"""
	Stable card id.
	"""
	id: String!
	"""
	Card schema.
	"""
	schema: String!
	"""
	Card payload as JSON.
	"""
	payload: JSON!
}

"""
Activity transcript item.
"""
type GraphqlActivity {
	"""
	Stable activity id.
	"""
	id: String!
	"""
	Activity kind.
	"""
	activityKind: String!
	"""
	Activity status.
	"""
	status: GraphqlTurnActivityStatus!
	"""
	Short display title.
