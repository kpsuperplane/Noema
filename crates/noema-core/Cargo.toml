[package]
name = "noema-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
local-model-evals = ["dep:sysinfo", "noema-providers/local-model-evals"]

[dependencies]
async-graphql.workspace = true
async-stream.workspace = true
base64.workspace = true
cap-std.workspace = true
chrono.workspace = true
figment.workspace = true
futures-util.workspace = true
http.workspace = true
libc.workspace = true
noema-artifacts = { path = "../noema-artifacts", default-features = false, features = ["filesystem"] }
noema-capabilities = { path = "../noema-capabilities" }
noema-capabilities-mcp = { path = "../noema-capabilities/mcp", default-features = false, features = ["transport"] }
noema-conversations = { path = "../noema-conversations" }
noema-home = { path = "../noema-home" }
noema-memory = { path = "../noema-memory", default-features = false, features = ["service"] }
noema-providers = { path = "../noema-providers", default-features = false, features = ["adapters", "local-models"] }
noema-store = { path = "../noema-store", default-features = false }
noema-tasks = { path = "../noema-tasks", default-features = false }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { workspace = true, optional = true }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
ts-rs.workspace = true

[dev-dependencies]
noema-store = { path = "../noema-store", default-features = false, features = ["test-support"] }
tempfile.workspace = true
