[package]
name = "noema-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
base64.workspace = true
cap-std.workspace = true
noema-artifacts = { path = "../noema-artifacts", default-features = false }
noema-capabilities = { path = "../noema-capabilities", default-features = false }
noema-capability-adapters = { path = "../noema-capabilities/adapters", default-features = false }
noema-capabilities-mcp = { path = "../noema-capabilities/mcp", default-features = false }
noema-conversations = { path = "../noema-conversations", default-features = false }
noema-providers = { path = "../noema-providers", default-features = false }
noema-tasks = { path = "../noema-tasks", default-features = false }
noema-workspaces = { path = "../noema-workspaces", default-features = false }
ring.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["parsing"] }
tokio.workspace = true

[dev-dependencies]
noema-home = { path = "../noema-home", default-features = false }
tempfile.workspace = true
