[package]
name = "noema-providers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
adapters = [
    "dep:async-stream",
    "dep:base64",
    "dep:obscura-browser",
    "dep:obscura-js",
    "dep:reqwest",
    "dep:readabilityrs",
    "dep:ring",
    "dep:scraper",
    "dep:tokio",
    "dep:tokio-util",
    "dep:url",
]
local-models = [
    "dep:fs2",
    "dep:reqwest",
    "dep:ring",
    "dep:tokio",
    "dep:tokio-util",
    "dep:toml",
    "dep:url",
]
local-model-evals = ["local-models"]

[dependencies]
async-stream = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
futures-util.workspace = true
noema-capabilities = { path = "../noema-capabilities", default-features = false }
noema-home = { path = "../noema-home", default-features = false }
obscura-browser = { workspace = true, features = ["stealth"], optional = true }
obscura-js = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["stream"], optional = true }
readabilityrs = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
scraper = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["codec"], optional = true }
toml = { workspace = true, optional = true }
ts-rs.workspace = true
url = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
