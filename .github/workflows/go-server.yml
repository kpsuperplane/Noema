name: Validate Go server

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./cmd/... ./internal/...
      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./cmd/... ./internal/...

  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Static analysis
        env:
          CGO_ENABLED: "0"
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./cmd/... ./internal/...
      - name: Vulnerability scan
        env:
          CGO_ENABLED: "0"
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./cmd/... ./internal/...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 github.com/99designs/gqlgen

  native-package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Build packaged server
        shell: bash
        run: scripts/build-go-server

  release-build:
    name: Release builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Check generated Go and web code
        run: |
          go tool gqlgen generate
          git diff --exit-code -- internal/graphql
          cd apps/web
          bun run check:generated
      - name: Check web types and lint
        working-directory: apps/web
        run: bun run lint
      - name: Build packaged server
        run: scripts/build-go-server
      - name: Cross-build release targets
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -tags noema_release -o "target/go/noema-$os-$arch" ./cmd/noema
          done
