name: Build Obscura worker release archives

on:
  workflow_dispatch:
  push:
    tags:
      - "obscura-worker-v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            architecture: amd64
            executable: noema-obscura-worker
            archive: noema-obscura-worker-linux-amd64.tar.gz
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            architecture: arm64
            executable: noema-obscura-worker
            archive: noema-obscura-worker-linux-arm64.tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            architecture: amd64
            executable: noema-obscura-worker
            archive: noema-obscura-worker-macos-amd64.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            architecture: arm64
            executable: noema-obscura-worker
            archive: noema-obscura-worker-macos-arm64.tar.gz
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows
            architecture: amd64
            executable: noema-obscura-worker.exe
            archive: noema-obscura-worker-windows-amd64.zip

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev

      - name: Configure macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          xcode_path="$(xcode-select -p)"
          sdk_path="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$sdk_path" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-isystem $sdk_path/usr/include/c++/v1" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$xcode_path/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Configure Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build worker
        run: >-
          cargo build --locked --release --target-dir target --target ${{ matrix.target }}
          -p noema-providers --features adapters --bin noema-obscura-worker

      - name: Check worker handshake
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          output="$(printf '{"version":1,"tool":"web.browse.close","arguments":{}}\n' |
            "$binary" --noema-browser-worker-v1 1024 1)"
          test "$(printf '%s\n' "$output" | wc -l | tr -d ' ')" = 2
          printf '%s\n' "$output" | sed -n '1p' | grep -Fx '{"version":1,"ready":true}'
          printf '%s\n' "$output" | sed -n '2p' | grep -F '"state":"closed"'

      - name: Stage archive contents
        run: |
          stage="dist/package"
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          obscura_commit="$(sed -n 's|.*obscura.git?rev=\([0-9a-f]\{40\}\)#.*|\1|p' Cargo.lock | head -n 1)"
          obscura_license=""
          for candidate in "$cargo_home"/git/checkouts/obscura-*/"${obscura_commit:0:7}"*/LICENSE; do
            [ ! -f "$candidate" ] || { obscura_license="$candidate"; break; }
          done
          test -n "$obscura_commit"
          test -f "$obscura_license"
          mkdir -p "$stage"
          cp "$binary" "$stage/${{ matrix.executable }}"
          cp LICENSE "$stage/LICENSE-NOEMA"
          cp "$obscura_license" "$stage/LICENSE-OBSCURA"
          executable_size="$(wc -c < "$binary" | tr -d ' ')"
          executable_sha="$(sha256sum "$binary" 2>/dev/null | awk '{print $1}')"
          if [ -z "$executable_sha" ]; then
            executable_sha="$(shasum -a 256 "$binary" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$executable_sha" "${{ matrix.executable }}" > "$stage/SHA256SUMS"
          cat > "$stage/metadata.json" <<EOF
          {
            "format": 1,
            "target": "${{ matrix.target }}",
            "platform": "${{ matrix.platform }}",
            "architecture": "${{ matrix.architecture }}",
            "executable": "${{ matrix.executable }}",
            "executable_size": $executable_size,
            "protocol": "noema-browser-worker-v1",
            "source_commit": "$GITHUB_SHA",
            "obscura_commit": "$obscura_commit"
          }
          EOF

      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: tar -czf "dist/${{ matrix.archive }}" -C dist/package .

      - name: Create Windows archive
        if: runner.os == 'Windows'
        run: cd dist/package && 7z a -tzip "../${{ matrix.archive }}" ./*

      - name: Write archive checksum and size
        run: |
          archive="dist/${{ matrix.archive }}"
          archive_sha="$(sha256sum "$archive" 2>/dev/null | awk '{print $1}')"
          if [ -z "$archive_sha" ]; then
            archive_sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$archive_sha" "${{ matrix.archive }}" > "$archive.sha256"
          wc -c < "$archive" | tr -d ' ' > "$archive.size"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: noema-obscura-worker-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
            dist/${{ matrix.archive }}.size
          if-no-files-found: error

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/obscura-worker-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: noema-obscura-worker-*
          path: dist
          merge-multiple: true

      - name: Check release assets
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" = 5
          test "$(find dist -maxdepth 1 -type f -name '*.sha256' | wc -l)" = 5
          test "$(find dist -maxdepth 1 -type f -name '*.size' | wc -l)" = 5

      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" dist/*
