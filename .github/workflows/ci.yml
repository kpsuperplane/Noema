name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cargo fetch --locked
      - run: swift build --package-path crates/noema-providers/apple-foundation-bridge
      - run: bun test scripts/*.test.ts
      - run: bun test crates/noema-desktop/scripts/prepare-local-runtime.test.ts
      - run: bun run scripts/check-crate-boundaries.ts
      - run: bun run scripts/check-focused-dependency-trees.ts
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo check -p noema-providers --no-default-features --all-targets
      - run: >-
          cargo check -p noema-providers
          --no-default-features
          --features local-models
          --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: bun run scripts/verify-rust-critical-tests.ts

  desktop-platform-check:
    name: Desktop check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cargo check --workspace
      - run: bun test crates/noema-desktop/scripts/prepare-local-runtime.test.ts
      - run: >-
          cargo test -p noema-providers
          --no-default-features
          --features local-models
          every_pinned_runtime_asset_resolves_for_its_injected_target_platform

  desktop-macos-build:
    name: Desktop no-bundle build (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cargo fetch --locked
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun install --frozen-lockfile
        working-directory: crates/noema-desktop
      - run: bun run build:no-bundle
        working-directory: crates/noema-desktop

  frontend-release:
    name: Frontend and release assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun run test
        working-directory: apps/web
      - run: bun run lint
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web
      - run: bun run build:tauri
        working-directory: apps/web
      - name: Check generated frontend artifacts
        run: bun run check:generated
        working-directory: apps/web
      - name: Verify release assets are embeddable
        run: cargo build -p noema-server --release
