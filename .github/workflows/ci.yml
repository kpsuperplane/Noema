name: CI

"on":
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-validation:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Activate pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain | grep '^1\.96\.0-'
          rustc --version
          cargo --version

      - name: Ensure sccache is available
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            brew install sccache
          fi
          sccache --version

      - name: Install frontend dependencies
        working-directory: crates/noema-core/web
        run: bun install --frozen-lockfile

      - name: Validate frontend
        working-directory: crates/noema-core/web
        run: |
          bun run check:generated
          bun run test:ci
          bun run lint
          bun run check:assets

      - name: Validate repository scripts
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/check_audit_coverage.py
          python3 scripts/check_generated_state.py --all

      - name: Install sidecar dependencies
        working-directory: crates/noema-core/mnemosyne-sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip install --group dev

      - name: Test sidecar
        working-directory: crates/noema-core/mnemosyne-sidecar
        run: python -m pytest

      - name: Validate Rust workspace
        run: |
          cargo fmt --all --check
          cargo check --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --no-fail-fast

      - name: Verify generated files remain clean
        run: git diff --exit-code
