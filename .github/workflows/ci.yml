name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cargo fetch --locked
      - run: swift build --package-path crates/noema-providers/apple-foundation-bridge
      - run: bun test scripts/*.test.ts
      - run: bun run scripts/check-crate-boundaries.ts
      - run: bun run scripts/check-focused-dependency-trees.ts
      - run: mkdir -p target/noema-core-decomposition-ci
      - run: >-
          bun run scripts/export-sqlite-schema-shape.ts
          --sql-output target/noema-core-decomposition-ci/sqlite-bootstrap.sql
          --output target/noema-core-decomposition-ci/sqlite-schema-shape.jsonl
      - run: >-
          bun run scripts/verify-decomposition-baselines.ts verify
          --baseline-root docs/superpowers/baselines
          --sqlite-bootstrap target/noema-core-decomposition-ci/sqlite-bootstrap.sql
          --sqlite-schema-shape target/noema-core-decomposition-ci/sqlite-schema-shape.jsonl
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo check -p noema-providers --no-default-features --all-targets
      - run: >-
          cargo check -p noema-providers
          --no-default-features
          --features local-models
          --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: bun run scripts/verify-rust-test-inventory.ts

  desktop-platform-check:
    name: Desktop check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - run: cargo check --workspace
      - run: >-
          cargo test -p noema-providers
          --no-default-features
          --features local-models
          every_pinned_runtime_asset_resolves_for_its_injected_target_platform

  frontend-release:
    name: Frontend and release assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: crates/noema-core/web
      - run: bun run test
        working-directory: crates/noema-core/web
      - run: bun run lint
        working-directory: crates/noema-core/web
      - run: bun run build
        working-directory: crates/noema-core/web
      - run: bun run build:tauri
        working-directory: crates/noema-core/web
      - name: Check generated frontend artifacts
        run: bun run check:generated
        working-directory: crates/noema-core/web
      - name: Verify release assets are embeddable
        run: cargo build -p noema-server --release

  python:
    name: Python sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/noema-memory/mnemosyne-sidecar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crates/noema-memory/mnemosyne-sidecar/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev .
      - run: python -m pytest -q tests
