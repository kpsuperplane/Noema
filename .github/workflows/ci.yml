name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.10
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  desktop-platform-check:
    name: Desktop check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - run: cargo check --workspace

  frontend-release:
    name: Frontend and release assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: crates/noema-core/web
      - run: bun run lint
        working-directory: crates/noema-core/web
      - run: bun run build
        working-directory: crates/noema-core/web
      - name: Check generated frontend artifacts
        run: git diff --exit-code -- crates/noema-core/web/src/generated crates/noema-core/web/src/routeTree.gen.ts
      - name: Verify release assets are embeddable
        run: cargo build -p noema-server --release

  python:
    name: Python sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/noema-core/mnemosyne-sidecar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crates/noema-core/mnemosyne-sidecar/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev .
      - run: python -m pytest -q tests
