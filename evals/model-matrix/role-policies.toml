schema_version = 1

[judge]
model = "openai/gpt-5.6-sol"
reasoning_effort = "medium"
maximum_output_tokens = 512

# Thresholds are deliberately explicit and reviewable. Quality is the fraction
# of deterministic suite cases passed. Provider errors include timeouts.

[[policies]]
role = "primary"
incumbent_candidate_id = "openrouter-luna-high-primary"
minimum_cases = 5
minimum_quality_score = 0.90
maximum_error_rate = 0.02
maximum_p95_latency_ms = 120000
replacement_quality_margin = 0.03
deterministic_weight = 0.70
judge_weight = 0.30
